<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing pages — Exemplos DD Digital</title>
<meta name="theme-color" content="#F3F1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Menu interno: escolher uma das 3 landing pages de exemplo. Tema claro, papel quente com luz suave. */
:root{--paper:#F3F1EC;--ink:#15161A;--mute:#7A786F;--line:rgba(21,22,26,.11);--ease:cubic-bezier(.2,.7,.1,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 20px;color:var(--ink);font:17px/1.4 'Instrument Sans',system-ui,-apple-system,"Segoe UI",sans-serif;background:
  radial-gradient(34% 40% at 12% 8%,rgba(210,255,58,.38),transparent 70%),
  radial-gradient(36% 42% at 92% 22%,rgba(255,90,31,.2),transparent 70%),
  radial-gradient(40% 44% at 50% 100%,rgba(227,193,112,.34),transparent 70%),
  var(--paper);overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(21,22,26,.16) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent)}
main{width:min(560px,100%)}
header p{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font:600 clamp(42px,8.4vw,68px)/1 'Fraunces',Georgia,serif;letter-spacing:-.02em}
ul{margin:30px 0 0;padding:0;list-style:none;display:grid;gap:14px}
li{animation:in .7s var(--ease) both}
li:nth-child(2){animation-delay:.08s}
li:nth-child(3){animation-delay:.16s}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
a{--c:#fff;position:relative;display:flex;align-items:center;gap:18px;padding:22px 22px 22px 24px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.72);color:inherit;text-decoration:none;box-shadow:0 12px 30px -22px rgba(21,22,26,.45);transition:background .35s var(--ease),border-color .35s,transform .35s var(--ease),box-shadow .35s}
a:hover,a:focus-visible{background:var(--c);border-color:var(--ink);transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(21,22,26,.55);outline:0}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.n{flex:none;width:34px;font:600 14px/1 'Instrument Sans',system-ui,sans-serif;letter-spacing:.06em;color:var(--mute)}
a:hover .n,a:focus-visible .n{color:var(--ink)}
a b{display:block;font:600 clamp(26px,5.2vw,32px)/1 'Fraunces',Georgia,serif;letter-spacing:-.015em}
a span.s{display:block;margin-top:6px;font-size:15px;color:var(--mute)}
a:hover span.s,a:focus-visible span.s{color:rgba(21,22,26,.75)}
.go{margin-left:auto;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);transition:background .3s,transform .35s var(--ease)}
a:hover .go,a:focus-visible .go{background:var(--ink);transform:rotate(-45deg)}
.go svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.2;transition:stroke .3s}
a:hover .go svg,a:focus-visible .go svg{stroke:#fff}
@media (prefers-reduced-motion:reduce){li{animation:none}a,.go{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <p>Exemplos DD Digital</p>
    <h1>Landing pages</h1>
  </header>
  <ul>
    <li><a href="BlackFriday/index.html" style="--c:#D2FF3A"><span class="n">01</span><div><b>Black Friday</b><span class="s">NOIR Audio · eletrónica</span></div><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></li>
    <li><a href="Natal/index.html" style="--c:#E3C170"><span class="n">02</span><div><b>Natal</b><span class="s">Mercearia da Estrela · cabazes gourmet</span></div><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></li>
    <li><a href="Janeiro/index.html" style="--c:#FF6A33"><span class="n">03</span><div><b>Janeiro</b><span class="s">FORJA · ginásio</span></div><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></li>
  </ul>
</main>
</body>
</html>
